name: Record a PR's tests

# Label a PR `record` and this records the tests the branch added, then comments
# the link. Deliberately separate from the test workflow: a recording is
# optional, the pull request it describes is not.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: record-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    # The label is the permission gate; a fork PR never reaches this job.
    if: >-
      github.event.label.name == 'record' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # One job per remote, mirroring ci.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mfe-react-modern
            port: 3001
          - app: mfe-react-legacy
            port: 3002
          - app: mfe-vue
            port: 3003
    name: record (${{ matrix.app }})
    runs-on: ubuntu-latest
    # Belt, not workaround: a recording must never cost more than a recording.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # comment the link, drop the label
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # The PR head, not the merge commit. fetch-depth: 0 because changed-since
      # needs history to reach the base commit.
      - name: Checkout the PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install mock service worker
        run: npm run setup:twd -w ${{ matrix.app }}

      - name: Start dev server
        run: |
          nohup npm run dev -w ${{ matrix.app }} > dev.log 2>&1 &
          npx wait-on http://localhost:${{ matrix.port }}

      - name: Record the tests this branch added
        id: rec
        uses: BRIKEV/twd-cli/.github/actions/record@2bc1f7f6c0f68e40ba961e865ab025c092976530 # v1.11.0
        with:
          working-directory: ${{ matrix.app }}
          changed-since: ${{ github.event.pull_request.base.sha }}
          artifact-name: twd-recording-pr-${{ github.event.pull_request.number }}-${{ matrix.app }}

      # Best effort: zero clips is a normal outcome, not a failure.
      - name: Comment the link
        if: always()
        continue-on-error: true
        env:
          APP: ${{ matrix.app }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLIPS: ${{ steps.rec.outputs.clip-count }}
          VIDEO_URL: ${{ steps.rec.outputs.artifact-url }}
        run: |
          if [ "${CLIPS:-0}" = "0" ]; then
            gh pr comment "$PR_NUMBER" --body "Nothing to record in ${APP}: this branch added no TWD tests there."
          else
            gh pr comment "$PR_NUMBER" --body "Recording (${APP}): ${CLIPS} clip(s), one per test this branch added — [download the artifact](${VIDEO_URL}) and unzip."
          fi

      # Dropping the label makes a retry one click instead of remove-then-add.
      # Every matrix job tries; after the first, it is already gone.
      - name: Drop the label
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label record
